name: release

# Releases shipkit-core and then ShipKit itself at the same version, from main. Run it from the
# Actions tab; docs/releasing.md lists what the maintainer sets up first and checks afterwards.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as 1.0.0 (without the v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  core:
    name: shipkit-core
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag the split of packages/shipkit-core
        env:
          SHIPKIT_CORE_SPLIT_TOKEN: ${{ secrets.SHIPKIT_CORE_SPLIT_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/split-core.sh "$VERSION"

      - name: Wait for Packagist to list the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS "https://repo.packagist.org/p2/shipwithian/shipkit-core.json" \
              | jq -e --arg v "$VERSION" '.packages["shipwithian/shipkit-core"][] | select(.version == $v)' >/dev/null; then
              echo "Packagist lists shipwithian/shipkit-core $VERSION"
              exit 0
            fi
            echo "Packagist does not list $VERSION yet (attempt $attempt of 40)"
            sleep 15
          done
          echo "Packagist never listed shipwithian/shipkit-core $VERSION. Register the package and its update hook (docs/releasing.md), then rerun." >&2
          exit 1

  template:
    name: ShipKit
    runs-on: ubuntu-latest
    needs: core
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare the release commit
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/prepare-release.sh "$VERSION" "$GITHUB_WORKSPACE"

      - name: Create a project from the release and run its checks
        env:
          SHIPKIT_CORE_SOURCE: packagist
          SHIPKIT_ARCHIVE_REF: HEAD
        run: .github/scripts/fresh-project.sh "$RUNNER_TEMP/fresh-project"

      - name: Push the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "refs/tags/v$VERSION"

name: split core

# Keeps the read-only shipkit-core repository, which Packagist serves, in step with packages/shipkit-core.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packages/shipkit-core/**

permissions:
  contents: read

concurrency:
  group: split-core
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish packages/shipkit-core
        env:
          SHIPKIT_CORE_SPLIT_TOKEN: ${{ secrets.SHIPKIT_CORE_SPLIT_TOKEN }}
        run: .github/scripts/split-core.sh

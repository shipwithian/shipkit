name: pull request base

# Keeps pull requests on the right branch. See the `branches` rule in shipkit-core.
#
# - Work targets the integration branch: the SHIPKIT_INTEGRATION_BRANCH repository variable,
#   `staging` by default. Set the variable to `main` in a project that works on one branch.
# - Only the release (from the integration branch) and a `hotfix/*` branch may target `main`,
#   because a merge into `main` deploys.
# - A pull request stacked on a branch that was already merged fails: GitHub retargets it only
#   when the merged branch is deleted, so merging it would land the work on a leftover branch.
#
# Until the integration branch exists (`php artisan shipkit:doctor --fix` creates it), pull
# requests into `main` pass with a notice.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  base:
    runs-on: ubuntu-latest

    steps:
      - name: Check the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          INTEGRATION: ${{ vars.SHIPKIT_INTEGRATION_BRANCH || 'staging' }}
        run: |
          if [ "$BASE" = "$INTEGRATION" ]; then
            echo "Targets the integration branch, $INTEGRATION."
            exit 0
          fi

          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" = "$INTEGRATION" ]; then
              echo "The release: $INTEGRATION into main."
              exit 0
            fi

            case "$HEAD" in
              hotfix/*)
                echo "A hotfix into main. Bring it back with a pull request from main into $INTEGRATION afterwards."
                exit 0
                ;;
            esac

            if ! gh api "repos/$REPOSITORY/branches/$INTEGRATION" --silent 2>/dev/null; then
              echo "::notice::The integration branch $INTEGRATION does not exist yet, so this pull request into main is allowed. Run: php artisan shipkit:doctor --fix"
              exit 0
            fi

            echo "::error::Pull requests target $INTEGRATION; only the release and hotfix/* branches target main. Retarget this one: gh pr edit $NUMBER --base $INTEGRATION"
            exit 1
          fi

          open=$(gh pr list --repo "$REPOSITORY" --head "$BASE" --state open --json number --jq 'length')

          if [ "$open" != "0" ]; then
            echo "Stacked on $BASE, which is still open."
            exit 0
          fi

          merged=$(gh pr list --repo "$REPOSITORY" --head "$BASE" --state merged --json number --jq 'map(.number) | join(", ")')

          if [ -n "$merged" ]; then
            echo "::error::The base branch $BASE was already merged (#$merged). Retarget this pull request before merging: gh pr edit $NUMBER --base $INTEGRATION"
            exit 1
          fi

          echo "Based on $BASE, which has no merged pull request."